<!DOCTYPE html>
<html lang="en">
  <head>
    <title>TwiBook</title>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Save Tweets. Come back and quote them later."
    />
    <meta itemprop="name" content="twiBook" />
    <meta
      itemprop="description"
      content="Save Tweets. Come back and quote them later."
    />
    <meta
      itemprop="image"
      content="https://twibooks.meje.dev/public/twibook.png"
    />
    <meta property="og:url" content="twibooks.meje.dev" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="twiBook" />
    <meta
      property="og:description"
      content="Save Tweets. Come back and quote them later."
    />
    <meta
      property="og:image"
      content="https://twibooks.meje.dev/public/twibook.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="twiBook" />
    <meta
      name="twitter:description"
      content="Save Tweets. Come back and quote them later."
    />
    <meta name="twitter:site" content="twibooks.meje.dev" />
    <meta
      name="twitter:image"
      content="https://twibooks.meje.dev/public/twibook.png"
    />
    <link rel="stylesheet" type="text/css" href="./style/global.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&family=Tilt+Neon&family=Tilt+Warp&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/d9e33f69d6.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <main id="root" class="root">
      <h1 class="app-name">twiBook</h1>
      <div class="insert-tweet">
        <form class="app-form" method="get">
          <label for="tweet title">
            Title
            <input
              type="text"
              name="title"
              id="title"
              value=""
              placeholder="give me a title"
            />
          </label>
          <label for="tweet link">
            Link
            <input
              type="text"
              name="link"
              id="link"
              value=""
              placeholder="enter link"
            />
          </label>
          <div class="btn-wrapper">
            <button class="save-tweet">Save</button>
          </div>

          <div class="error-messages">
            <div class="modal success"></div>
            <div class="modal error"></div>
          </div>
        </form>
      </div>
      <!-- results component -->
      <div class="saved-tweets-container">
        <form class="search-tweets">
          <input
            id="search"
            type="text"
            name="search"
            value=""
            placeholder="search for tweets"
          />
        </form>
        <div class="tweets"></div>
        <button class="add-tweet">&plus;</button>
      </div>
    </main>
    <script src="./index.js"></script>
  </body>
</html>
